<html>
<head><title>Calculator</title></head>
<body>
<style>
.calculator{
	padding: 25px;
	border-radius: 10px;
	background-color: #2c3e50;
	width: 280px;
	align: center;
}
#screen{
	width: 100%;
	height: 65px;
	font-size: 30px;
	text-align: right;
	margin-bottom: 15px;
	box-sizing: border-box;
}
body {
    display: flex;
    justify-content: center; 
    align-items: center;    
    height: 100vh;       
    margin: 0;         
    background-color: #f0f0f0;
}
.button-grid{
	display: grid;
	grid-template-columns: repeat(4,1fr);
	gap: 12px;
}
button{
	background-color: #34495e;
	color: white;
	padding: 18px;
	font-size: 20px;
	border-radius: 5px;
	margin: 0px;
	cursor: pointer;
	border: none;
}
button:hover{
	background-color: #4e6d8d;
}
.op-button {
            background-color: #e67e22;
}
.eq-button{
	background-color: green;
}
.clear-button{
	background-color: red;
	grid-column: span 3;
}
</style>
<div class="calculator">
<input type="text" id="screen"></input>
<div class="button-grid">
<button class="clear-button" onclick="clearscreen()">C</button>
<button class="op-button"onclick="typenumber('/')">/</button>
<button onclick="typenumber('7')">7</button>
<button onclick="typenumber('8')">8</button>
<button onclick="typenumber('9')">9</button>
<button class="op-button"onclick="typenumber('*')">*</button>
<button onclick="typenumber('4')">4</button>
<button onclick="typenumber('5')">5</button>
<button onclick="typenumber('6')">6</button>
<button class="op-button"onclick="typenumber('-')">-</button>
<button onclick="typenumber('1')">1</button>
<button onclick="typenumber('2')">2</button>
<button onclick="typenumber('3')">3</button>
<button class="op-button"onclick="typenumber('+')">+</button>
<button onclick="typenumber('0')">0</button>
<button onclick="typenumber('.')">.</button>
<button class="del-button"onclick="deletenumber()">Del</button>
<button class="eq-button" onclick="calculatescreen()">=</button>
</div>
</div>
<script>
	function typenumber(character){
		let addscreen=document.getElementById('screen');
		addscreen.value += character;
	}
	function calculatescreen(){
		let addscreen=document.getElementById('screen');
		try {
			addscreen.value=eval(addscreen.value);
		} catch(e){
			addscreen.value="Error";
			}
	}
	function clearscreen(){
		let addscreen=document.getElementById('screen');
		addscreen.value='';
	}
	function deletenumber(){
		let addscreen=document.getElementById('screen');
		addscreen.value=addscreen.value.slice(0,-1);
	}
</script>
</body>
</html>
